<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcion</title>
</head>
<body>

    <h1>Función de multiplicación</h1>

    <p id="demo"></p>

    <script>
        function multiplicar(p1, p2){
            return p1 * p2;
        }

        document.getElementById("demo").innerHTML = multiplicar(4,3);
    </script>

</body>
</html>
