
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de información</title>
</head>
<body>

    <h1>Formulario de información</h1>

    <form action="#" method="get">

        <label for="numero">Number:</label><br>
        <input type="number" id="numero" name="numero"><br><br>

        <label for="correo">E-Mail:</label><br>
        <input type="email" id="correo" name="correo"><br><br>

        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre"><br><br>

        <label for="apellido">Apellido:</label><br>
        <input type="text" id="apellido" name="apellido"><br><br>

        <label for="fecha">Fecha de nacimiento:</label><br>
        <input type="date" id="fecha" name="fecha"><br><br>

        <label for="pagina">Página web:</label><br>
        <input type="url" id="pagina" name="pagina"><br><br>

        <p>¿Qué estándares conoces?</p>

        <input type="checkbox" id="css3" name="estandares" value="CSS3">
        <label for="css3">CSS3</label><br>

        <input type="checkbox" id="javascript" name="estandares" value="JavaScript">
        <label for="javascript">JavaScript</label><br><br>

        <label for="comentario">Comentarios:</label><br>
        <textarea id="comentario" name="comentario" cols="15" rows="6"></textarea><br><br>

        <button type="submit">Enviar información</button>

    </form>

</body>
</html>
